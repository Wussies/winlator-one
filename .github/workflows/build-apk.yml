name: Build APK

on:
  push:
    branches: [ main, 'dev/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (NDK 24, CMake 3.22.1, API 35)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1" > /dev/null
          echo "Installed NDKs:" && ls "$ANDROID_HOME/ndk"

      - name: Set up Gradle (validates the wrapper JAR)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode private signing key (optional)
        env:
          ONE_KEYSTORE_BASE64: ${{ secrets.ONE_KEYSTORE_BASE64 }}
        if: ${{ env.ONE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ONE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/one.keystore"
          echo "ONE_KEYSTORE_FILE=$RUNNER_TEMP/one.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          ONE_KEYSTORE_PASSWORD: ${{ secrets.ONE_KEYSTORE_PASSWORD }}
          ONE_KEY_ALIAS: ${{ secrets.ONE_KEY_ALIAS }}
          ONE_KEY_PASSWORD: ${{ secrets.ONE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          VERSION=$(grep -m1 'def oneVersionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          NAME="WinlatorOne-${VERSION}-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Report native library page alignment (informational)
        run: bash tools/check_elf_alignment.sh "dist/${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 'def oneVersionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      # Every successful build of main becomes a downloadable pre-release, so
      # the APK can be installed straight from the phone (no zip artifact).
      - name: Publish build as GitHub pre-release (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Winlator One ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automatic build of `${{ github.sha }}`.
            Not tested on device yet. See CHANGELOG-ONE.md and docs/BUILDING.md.
          files: dist/*
          prerelease: true

      - name: Publish GitHub Release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
