name: Semgrep audit (Stage 0, rerun)

on:
  push:
    branches: [ 'audit/nexora-stage0' ]
    paths: [ '.github/workflows/semgrep-audit.yml' ]  # rerun 2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gamenative, repo: utkarshdalal/GameNative, ref: f627ee074cd3712097db5641be22358394f0d854 }
          - { name: winnative, repo: WinNative-Emu/WinNative, ref: 72d145bccff348f71b1c8baf90a180ccaa474464 }
          - { name: winlator-app, repo: brunodev85/winlator-app, ref: 2c33741d50c5daab0521a098be5c969f63b9e887 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: target
          persist-credentials: false
      - name: Semgrep
        run: |
          mkdir -p out
          pip install --quiet semgrep
          semgrep --version | tee out/version.txt
          set +e
          for cfg in p/java p/kotlin p/c p/secrets p/github-actions p/insecure-transport p/default; do
            n=$(echo $cfg | tr '/' '_')
            semgrep scan --timeout 60 --max-target-bytes 2000000 --config $cfg \
              --exclude 'target/app/src/main/cpp/proot' --json --output out/$n.json target 2>/dev/null
            echo "$cfg exit=$?" >> out/version.txt
            python3 -c "import json,sys;d=json.load(open('out/$n.json'));print('$cfg', len(d.get('results',[])), 'results', [e.get('message','')[:160] for e in d.get('errors',[])][:3])" | tee -a out/errors.txt
          done
          python3 -c "
          import json,glob
          r=[];seen=set()
          for f in glob.glob('out/p_*.json'):
              for x in json.load(open(f)).get('results',[]):
                  k=(x['check_id'],x['path'],x['start']['line'])
                  if k not in seen: seen.add(k); r.append(x)
          json.dump({'results':r,'errors':[]},open('out/semgrep.json','w'))
          "
          rm -f out/p_*.json
          python3 - <<'EOF'
          import json, collections
          d = json.load(open("out/semgrep.json"))
          r = d.get("results", [])
          errs = d.get("errors", [])
          sev = collections.Counter(x["extra"].get("severity", "?") for x in r)
          rules = collections.Counter(x["check_id"].split(".")[-1] for x in r)
          L = [f"## Semgrep {open('out/version.txt').read().strip()}", f"Findings: {len(r)}, by severity {dict(sev)}; scan errors: {len(errs)}", "", "### Top rules"]
          L += [f"- {k}: {v}" for k, v in rules.most_common(30)]
          L += ["", "### ERROR-severity findings"]
          L += [f"- `{x['path'].replace('target/','')}:{x['start']['line']}` {x['check_id'].split('.')[-1]}" for x in r if x['extra'].get('severity') == 'ERROR'][:100]
          L += ["", "### WARNING-severity (first 60)"]
          L += [f"- `{x['path'].replace('target/','')}:{x['start']['line']}` {x['check_id'].split('.')[-1]}" for x in r if x['extra'].get('severity') == 'WARNING'][:60]
          open("out/semgrep.md", "w").write("\n".join(L) + "\n")
          print("\n".join(L[:3]))
          EOF
          rm -f out/semgrep.json
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ matrix.name }}
          path: out/

  publish:
    needs: semgrep
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/results
      - uses: actions/download-artifact@v4
        with:
          path: semgrep-results
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semgrep-results
          git commit -q -m "Semgrep rerun results (run ${{ github.run_id }})"
          git push origin HEAD:audit/results
