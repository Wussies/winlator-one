pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // NEXORA: snapshot repositories and JitPack removed (no dependency needs
        // them; mutable artifacts are a supply-chain risk).
        exclusiveContent {
            forRepository {
                maven { url = uri("${rootDir}/vendor/maven") }
            }
            filter { includeGroup 'org.libsdl.android' }
        }
    }
}

rootProject.name = "Winlator"
include ':app'
include ':framegen'
include ':armsx2'
include ':dolphin'
